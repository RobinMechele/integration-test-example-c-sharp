<text x="404.0" y="480.0" class="s muted" text-anchor="middle">–</text>
<rect x="508.0" y="463.0" width="64" height="24" rx="12" class="dbl"/><text x="540.0" y="479.5" class="xs b dbl-t" text-anchor="middle">SPY</text>
<rect x="644.0" y="463.0" width="64" height="24" rx="12" class="dbl"/><text x="676.0" y="479.5" class="xs b dbl-t" text-anchor="middle">SPY</text>
<text x="812.0" y="480.0" class="s muted" text-anchor="middle">–</text>
<text x="42" y="519.0" class="s b" text-anchor="start">Clock</text>
<text x="42" y="535.0" class="xs muted" text-anchor="start">TimeProvider</text>
