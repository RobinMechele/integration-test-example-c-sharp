<rect x="24.0" y="624" width="60" height="24" rx="12" class="real"/><text x="54" y="640.5" class="xs b real-t" text-anchor="middle">REAL</text>
<text x="94" y="640.5" class="xs muted" text-anchor="start">Oracle 23 in Docker, started by Testcontainers</text>
<rect x="400.0" y="624" width="48" height="24" rx="12" class="dbl"/><text x="424" y="640.5" class="xs b dbl-t" text-anchor="middle">SPY</text>
<rect x="454.0" y="624" width="56" height="24" rx="12" class="dbl"/><text x="482" y="640.5" class="xs b dbl-t" text-anchor="middle">FAKE</text>
<text x="520" y="640.5" class="xs muted" text-anchor="start">test doubles, only at the edge of the system</text>
