<circle cx="30" cy="163.0" r="5" class="dot-api"/>
<text x="42" y="168.0" class="s b" text-anchor="start">Ordering.Api</text>
<text x="42" y="185.0" class="xs muted" text-anchor="start">endpoints, ProblemDetails</text>
<line x1="24" y1="198" x2="876" y2="198" class="sep"/>
<circle cx="30" cy="221.0" r="5" class="dot-app"/>
<text x="42" y="226.0" class="s b" text-anchor="start">Ordering.Application</text>
<text x="42" y="243.0" class="xs muted" text-anchor="start">handlers, validators</text>
<line x1="24" y1="256" x2="876" y2="256" class="sep"/>
<circle cx="30" cy="279.0" r="5" class="dot-dom"/>
<text x="42" y="284.0" class="s b" text-anchor="start">Ordering.Domain</text>
<text x="42" y="301.0" class="xs muted" text-anchor="start">business rules</text>
<line x1="24" y1="314" x2="876" y2="314" class="sep"/>
<circle cx="30" cy="337.0" r="5" class="dot-inf"/>
<text x="42" y="342.0" class="s b" text-anchor="start">Ordering.Infrastructure</text>
<text x="42" y="359.0" class="xs muted" text-anchor="start">EF Core, outbox</text>
<rect x="210" y="264" width="116" height="42" rx="8" class="bar"/><text x="268.0" y="282.0" class="xs b" text-anchor="middle">business rules</text><text x="268.0" y="298.0" class="xs muted" text-anchor="middle">and domain events</text>
<rect x="346" y="206" width="116" height="42" rx="8" class="bar"/><text x="404.0" y="224.0" class="xs b" text-anchor="middle">validators and</text><text x="404.0" y="240.0" class="xs muted" text-anchor="middle">pipeline behaviour</text>
<rect x="482" y="322" width="116" height="42" rx="8" class="bar"/><text x="540.0" y="340.0" class="xs b" text-anchor="middle">mappings, outbox,</text><text x="540.0" y="356.0" class="xs muted" text-anchor="middle">concurrency</text>
<rect x="618" y="148" width="116" height="216" rx="8" class="bar"/><text x="676.0" y="253.0" class="xs b" text-anchor="middle">real HTTP requests</text><text x="676.0" y="269.0" class="xs muted" text-anchor="middle">through every layer</text>
<rect x="754" y="148" width="116" height="216" rx="8" class="bar dash"/><text x="812.0" y="253.0" class="xs b" text-anchor="middle">dependency rule</text><text x="812.0" y="269.0" class="xs muted" text-anchor="middle">(static analysis)</text>
<line x1="24" y1="372" x2="876" y2="372" class="sep"/>
<text x="24" y="400" class="xs b muted" text-anchor="start" letter-spacing="0.08em">OUTSIDE THE PROCESS</text>
<text x="42" y="427.0" class="s b" text-anchor="start">Oracle database</text>
