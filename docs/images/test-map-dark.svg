<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-label="What each test project exercises">
<title>What each test project exercises</title>
<style>
  .card { fill: #0d1117; stroke: #30363d; }
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #e6edf3; }
  .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .muted { fill: #9198a1; }
  .h1 { font-size: 20px; font-weight: 600; }
  .h2 { font-size: 15px; font-weight: 600; }
  .b { font-weight: 600; }
  .s { font-size: 13px; }
  .xs { font-size: 12px; }
  .ln { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  .head { fill: #8b949e; }
  .bar { fill: #161b22; stroke: #6e7681; stroke-width: 1.2; }
  .sep { stroke: #30363d; stroke-width: 1; }
  .dom { fill: #2b2111; stroke: #bb8009; stroke-width: 1.5; } .dom-t { fill: #e3b341; }
  .app { fill: #0f2a1a; stroke: #2ea043; stroke-width: 1.5; } .app-t { fill: #56d364; }
  .inf { fill: #0c2440; stroke: #388bfd; stroke-width: 1.5; } .inf-t { fill: #79c0ff; }
  .api { fill: #24173d; stroke: #a371f7; stroke-width: 1.5; } .api-t { fill: #d2a8ff; }
  .real { fill: #0f2a1a; stroke: #2ea043; stroke-width: 1.3; } .real-t { fill: #56d364; }
  .dbl { fill: #2d1708; stroke: #db6d28; stroke-width: 1.3; stroke-dasharray: 4 3; } .dbl-t { fill: #ffa657; }
  .pa { fill: #0c2440; stroke: #388bfd; stroke-width: 1.3; } .pa-t { fill: #388bfd; }
  .pb { fill: #24173d; stroke: #a371f7; stroke-width: 1.3; } .pb-t { fill: #a371f7; }
  .done { fill: #161b22; stroke: #30363d; stroke-width: 1; } .done-t { fill: #6e7681; }
  .dot-dom { fill: #bb8009; } .dot-app { fill: #2ea043; } .dot-inf { fill: #388bfd; } .dot-api { fill: #a371f7; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="card" x="0.5" y="0.5" width="899" height="679" rx="12"/>
<text x="24" y="40" class="h1" text-anchor="start">What each test project exercises</text>
<text x="24" y="63" class="s muted" text-anchor="start">Unit tests need nothing but the code. Integration tests run against a real Oracle database in Docker.</text>
<text x="268.0" y="100" class="s b" text-anchor="middle">Domain</text>
<text x="268.0" y="117" class="xs muted" text-anchor="middle">UnitTests</text>
<text x="404.0" y="100" class="s b" text-anchor="middle">Application</text>
<text x="404.0" y="117" class="xs muted" text-anchor="middle">UnitTests</text>
<text x="540.0" y="100" class="s b" text-anchor="middle">Infrastructure</text>
<text x="540.0" y="117" class="xs muted" text-anchor="middle">IntegrationTests</text>
<text x="676.0" y="100" class="s b" text-anchor="middle">Api</text>
<text x="676.0" y="117" class="xs muted" text-anchor="middle">IntegrationTests</text>
<text x="812.0" y="100" class="s b" text-anchor="middle">Architecture</text>
<text x="812.0" y="117" class="xs muted" text-anchor="middle">Tests</text>
<text x="24" y="130" class="xs b muted" text-anchor="start" letter-spacing="0.08em">LAYERS</text>
