<text x="404.0" y="526.0" class="s muted" text-anchor="middle">–</text>
<rect x="508.0" y="509.0" width="64" height="24" rx="12" class="dbl"/><text x="540.0" y="525.5" class="xs b dbl-t" text-anchor="middle">FAKE</text>
<rect x="644.0" y="509.0" width="64" height="24" rx="12" class="dbl"/><text x="676.0" y="525.5" class="xs b dbl-t" text-anchor="middle">FAKE</text>
<text x="812.0" y="526.0" class="s muted" text-anchor="middle">–</text>
