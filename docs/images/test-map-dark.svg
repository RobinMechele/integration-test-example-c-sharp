<text x="676.0" y="576" class="s b" text-anchor="middle">22 tests</text>
<text x="676.0" y="593" class="xs muted" text-anchor="middle">own container</text>
<text x="812.0" y="576" class="s b" text-anchor="middle">6 tests</text>
<text x="812.0" y="593" class="xs muted" text-anchor="middle">milliseconds</text>
